name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          always-auth: true

      - name: Install dependencies
        run: npm ci

      - name: Validate release manifests
        run: npx tsx scripts/release-manifest-check.ts

      - name: Type check all packages
        run: npm run typecheck:all

      - name: Run tests
        run: npm test

      - name: Build all packages
        run: npm run build:all

      - name: Test published package contents
        run: npm run test:pack

      - name: Publish missing packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is required" >&2
            exit 1
          fi

          verify_metadata() {
            local name="$1"
            local version="$2"
            local requires_core="$3"
            node --input-type=module -e '
              import { readFileSync } from "node:fs"

              const packageInfo = JSON.parse(readFileSync(0, "utf8"))
              const [name, version, requiresCore] = process.argv.slice(1)
              if (packageInfo.name !== name || packageInfo.version !== version) {
                throw new Error(`Registry metadata did not match ${name}@${version}`)
              }
              if (requiresCore === "true" && packageInfo.dependencies?.["@benjamolina/antigravity-guard-core"] !== "0.1.0") {
                throw new Error(`${name}@${version} does not retain the exact core dependency`)
              }
            ' "$name" "$version" "$requires_core"
          }

          query_exact_version() {
            local name="$1"
            local version="$2"
            local requires_core="$3"
            local output
            local status

            if output=$(npm view "${name}@${version}" --json 2>&1); then
              printf '%s' "$output" | verify_metadata "$name" "$version" "$requires_core"
              return 0
            else
              status=$?
            fi

            if printf '%s\n' "$output" | grep -Eq 'npm (ERR!|error) code E404'; then
              return 1
            fi

            printf '%s\n' "$output" >&2
            echo "npm view failed for ${name}@${version} (status ${status}); only E404 is treated as missing" >&2
            return 2
          }

          publish_if_missing() {
            local name="$1"
            local version="$2"
            local workspace="$3"
            local requires_core="$4"
            local query_status

            if query_exact_version "$name" "$version" "$requires_core"; then
              echo "Verified existing ${name}@${version}; skipping publish"
              return
            else
              query_status=$?
            fi

            if [ "$query_status" -ne 1 ]; then
              exit "$query_status"
            fi

            echo "Publishing missing ${name}@${version}"
            if [ -n "$workspace" ]; then
              npm publish --workspace="$workspace" --access public --tag latest --provenance
            else
              npm publish --access public --tag latest --provenance
            fi

            if ! query_exact_version "$name" "$version" "$requires_core"; then
              echo "Published ${name}@${version} but it could not be verified" >&2
              exit 1
            fi
          }

          publish_if_missing "@benjamolina/antigravity-guard-core" "0.1.0" "@benjamolina/antigravity-guard-core" false
          publish_if_missing "@benjamolina/pi-antigravity-guard" "0.1.0" "@benjamolina/pi-antigravity-guard" true
          publish_if_missing "@benjamolina/opencode-antigravity-guard" "1.1.11" "" true

      - name: Create matching tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v1.1.11"
          git fetch --tags --force
          if git rev-parse "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Existing ${TAG} points to ${TAG_SHA}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "Verified existing ${TAG} at ${GITHUB_SHA}"
          else
            git tag -a "$TAG" "$GITHUB_SHA" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

          RELEASE_OUTPUT=$(mktemp)
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .tag_name >"$RELEASE_OUTPUT" 2>&1; then
            if [ "$(cat "$RELEASE_OUTPUT")" != "$TAG" ]; then
              echo "Existing GitHub release did not resolve to ${TAG}" >&2
              exit 1
            fi
            echo "Verified existing GitHub release for ${TAG}"
            exit 0
          fi

          if ! grep -q 'HTTP 404' "$RELEASE_OUTPUT"; then
            cat "$RELEASE_OUTPUT" >&2
            echo "GitHub release lookup failed; only HTTP 404 is treated as missing" >&2
            exit 1
          fi

          NOTES=$(mktemp)
          cat >"$NOTES" <<'EOF'
          ## Published packages

          - Core: `@benjamolina/antigravity-guard-core@0.1.0`
          - Pi: `@benjamolina/pi-antigravity-guard@0.1.0`
          - OpenCode root: `@benjamolina/opencode-antigravity-guard@1.1.11`

          ### Upgrade the root plugin

          ```bash
          npm install @benjamolina/opencode-antigravity-guard@1.1.11
          ```
          EOF
          sed -i 's/^          //' "$NOTES"
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .tag_name | grep -Fx "$TAG"
